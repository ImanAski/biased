# =============================================================================
#  Bias Controller — widget layout & protocol
# =============================================================================
#
#  This file decides which monitor cards and control widgets appear in the app,
#  and (optionally) how bytes are framed on the wire.
#  Edit it with any text editor, then press "Reload" in Settings (or restart the
#  app). A broken file is reported in the UI and the last good layout is kept.
#
#  The app copies this file to its own config directory on first launch:
#    Windows : %APPDATA%\com.iman.tauri-biased\widgets.toml
#    macOS   : ~/Library/Application Support/com.iman.tauri-biased/widgets.toml
#    Linux   : ~/.config/com.iman.tauri-biased/widgets.toml
#
#  Exporting a configuration-locked customer build embeds this file into the
#  executable, so protocol/layout choices made here become fixed for that build.
#
#  [protocol] (wire behavior; editable in editor builds, locked in customer):
#    driver          "rs" (master-driven binary transactions) or "legacy"
#    tickMs          master clock period in ms (10..60000)
#    periodicSend    send the 2-byte status read on every tick when connected
#    rxSync          header for status reads and received telemetry frames (0x77)
#    txHeader        header for write/command frames and their ACK (0x71)
#    rxFooter        footer for status reads, telemetry frames and ACKs (0x23)
#    txFooter        footer byte for transmitted write/command frames
#    endianness      "little" or "big" for uint16 wire fields
#    crc             "none" | "crc16_modbus" | "crc16_ibm" | "crc16_ccitt_false"
#    ditherAmpScale  UI amplitude * scale -> uint16 wire value
#    ditherFreqScale UI frequency * scale -> uint16 wire value
#    telemetryScale  uint16 wire value / scale -> UI telemetry units (and gain/offset scaling)
#                    (per-widget display scaling uses `scale` on [[monitors]] below)
#
#  Monitors (read-only, fed by inbound telemetry):
#    id          unique name for this widget
#    label       card title (defaults to id)
#    source      telemetry field: theta0 | temp | biasVoltage | inputPower |
#                outputPower | biasCurrent | supplyVoltage | phaseError |
#                lockStatus (defaults to id)
#    variant     bar | gauge | sparkline | led | tile | meter (default bar)
#    history     samples kept by the sparkline variant (8..600, default 60)
#    segments    cells drawn by the meter variant (5..40, default 20)
#    unit        unit suffix shown next to the value
#    digits      decimal places (default 1)
#    scale       display multiplier for inbound telemetry (default 1.0; finite and
#                non-zero). Applied before digits/range/threshold; wire decoding,
#                packet templates and other widgets are unaffected.
#    description small caption under the value
#    range       display range: { min = 0, max = 100 }
#    threshold   alarm limits:             { low = 10, high = 80 }
#
#  Controls (writable command snapshot):
#    id/label/kind/target/unit/description/options/presets/range as before.
#    (kind: toggle | select | range | stepper | knob | segmented)
# =============================================================================

title = "MCU-04 · Bias stage"

[protocol]
driver = "rs"
tickMs = 300
periodicSend = true
rxSync = 0x77
txHeader = 0x71
rxFooter = 0x23
txFooter = 0x00
endianness = "big"
crc = "none"
ditherAmpScale = 1000.0
ditherFreqScale = 1.0
telemetryScale = 100.0

# --------------------------------- Monitors ----------------------------------

[[monitors]]
id = "theta0"
label = "Θ₀"
source = "theta0"
unit = "°"
digits = 1
variant = "bar"
description = "Measured angle"
range = { min = -180, max = 180 }
threshold = { low = -90, high = 90 }

[[monitors]]
id = "temp"
label = "Temperature"
source = "temp"
unit = "°C"
digits = 1
variant = "gauge"
description = "Board temperature"
range = { min = 0, max = 100 }
threshold = { low = 5, high = 75 }

[[monitors]]
id = "input_power"
label = "Input power"
source = "inputPower"
unit = "W"
digits = 2
variant = "meter"
segments = 24
description = "Measured at input"
range = { min = 0, max = 100 }
threshold = { high = 90 }

[[monitors]]
id = "output_power"
label = "Output power"
source = "outputPower"
unit = "W"
digits = 2
variant = "sparkline"
history = 90
description = "Measured at output"
range = { min = 0, max = 100 }
threshold = { low = 5, high = 80 }

[[monitors]]
id = "bias_current"
label = "Bias current"
source = "biasCurrent"
unit = "A"
digits = 3
variant = "tile"
description = "Current through the bias stage"
range = { min = 0, max = 1 }
threshold = { high = 0.8 }

[[monitors]]
id = "supply_voltage"
label = "Supply voltage"
source = "supplyVoltage"
unit = "V"
digits = 2
variant = "sparkline"
history = 120
description = "Rail feeding the output stage"
range = { min = 0, max = 15 }
threshold = { low = 11, high = 13 }

[[monitors]]
id = "phase_error"
label = "Phase error"
source = "phaseError"
unit = "°"
digits = 2
variant = "gauge"
description = "Residual loop phase error"
range = { min = -10, max = 10 }
threshold = { low = -2, high = 2 }

[[monitors]]
id = "lock_status"
label = "Loop lock"
source = "lockStatus"
variant = "led"
description = "MCU reports a locked loop"

# --------------------------------- Controls ----------------------------------

[[controls]]
id = "bias_enabled"
label = "Bias output"
kind = "toggle"
target = "biasEnabled"
description = "Master enable for the bias stage"

[[controls]]
id = "bias_point"
label = "Bias point"
kind = "select"
target = "biasPoint"
description = "Operating point of the bias loop"
options = ["QUAD+", "QUAD-", "MAX", "NULL"]

[[controls]]
id = "dither_amp"
label = "Dither amplitude"
kind = "range"
target = "ditherAmp"
unit = "V"
description = "Peak-to-peak dither amplitude"
range = { min = 0, max = 10, step = 0.01 }
presets = [0, 0.5, 1, 5]

[[controls]]
id = "dither_freq"
label = "Dither frequency"
kind = "range"
target = "ditherFreq"
unit = "Hz"
description = "Dither tone frequency"
range = { min = 1, max = 5000, step = 1 }
presets = [10, 100, 1000, 2500]

[[controls]]
id = "mode"
label = "Operating mode"
kind = "select"
target = "mode"
description = "Mode code passed through to the MCU"
options = ["0", "1", "2", "3"]

[[controls]]
id = "gain"
label = "Loop gain"
kind = "knob"
target = "gain"
unit = "×"
description = "Error amplifier gain"
range = { min = 0, max = 4, step = 0.05 }
presets = [0.5, 1, 2]

[[controls]]
id = "offset"
label = "Loop offset"
kind = "stepper"
target = "offset"
unit = "V"
description = "Fine trim added to the bias setpoint"
range = { min = -5, max = 5, step = 0.1 }
presets = [-1, 0, 1]
